{% extends 'base.html' %}
{% block content %}
<div class="panel p-3 p-md-4 mb-4">
  <h2 class="h4 mb-3">Top Schools Ranking</h2>
  <form class="row g-2" method="get">
    <div class="col-md-5"><input class="form-control" name="q" value="{{ q }}" placeholder="输入学校名称搜索" /></div>
    <div class="col-md-4">
      <select class="form-select" name="location">
        <option value="">全部地区</option>
        {% for l in locations %}
        <option value="{{ l }}" {% if l==location %}selected{% endif %}>{{ l }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-3"><button class="btn btn-primary w-100">筛选结果</button></div>
  </form>
</div>

<div class="table-wrap p-2 p-md-3">
  <div class="table-responsive">
    <table class="table table-striped align-middle mb-0">
      <thead><tr><th>#</th><th>School</th><th>Location</th><th>Score</th><th>Tuition</th><th>Notes</th></tr></thead>
      <tbody>
        {% for r in rankings %}
        <tr>
          <td>{{ r.rank }}</td><td>{{ r.school }}</td><td>{{ r.location }}</td><td>{{ '%.1f'|format(r.score) }}</td><td>{{ r.tuition }}</td><td>{{ r.notes }}</td>
        </tr>
        {% else %}
        <tr><td colspan="6" class="text-center py-4">暂无数据</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
