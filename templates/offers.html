{% extends 'base.html' %}
{% block content %}
<section class="panel p-4 p-md-5 my-4">
  <h2 class="fw-bold mb-2">Offer 展示墙</h2>
  <p class="text-secondary mb-0">每次轮播展示 3 张真实 offer 图片，可左右切换查看。</p>
</section>

<section class="panel p-4 mb-4">
  <h3 class="fw-bold mb-3">最新 Offer（每屏 3 张）</h3>
  <div id="offerCarousel" class="carousel slide" data-bs-ride="carousel" data-bs-interval="4500">
    <div class="carousel-inner">
      {% for slide in offer_slides %}
      <div class="carousel-item {% if loop.first %}active{% endif %}">
        <div class="offer-gallery-grid">
          {% for image in slide %}
          <div class="offer-image-card">
            <img src="{{ url_for('static', filename=image) }}" alt="offer-{{ loop.index }}" loading="lazy">
          </div>
          {% endfor %}
        </div>
      </div>
      {% endfor %}
    </div>

    <button class="carousel-control-prev" type="button" data-bs-target="#offerCarousel" data-bs-slide="prev">
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Previous</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#offerCarousel" data-bs-slide="next">
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Next</span>
    </button>
  </div>
</section>
{% endblock %}
