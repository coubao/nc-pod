<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ title or '瀛动教育 | Ranking' }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='styles.css') }}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light glass-nav border-bottom">
  <div class="container py-2">
    <a class="navbar-brand d-flex align-items-center gap-2" href="{{ url_for('index') }}">
      <img src="{{ url_for('static', filename='logo.svg') }}" alt="瀛动教育" height="36">
    </a>
    <div class="d-flex gap-2">
      <a class="btn btn-outline-light btn-sm" href="{{ url_for('home') }}">官网首页</a>
      <a class="btn btn-outline-light btn-sm" href="{{ url_for('index') }}">排行榜</a>
      <a class="btn btn-primary btn-sm" href="{{ url_for('admin') }}">后台管理</a>
    </div>
  </div>
</nav>

<header class="hero-section">
  <div class="container py-5">
    <div class="hero-card">
      <h1 class="display-6 fw-bold mb-2">2026 美国大学排名</h1>
      <p class="mb-0 text-secondary">以清晰数据和可筛选维度，帮助学生更快找到合适院校。</p>
    </div>
  </div>
</header>

<div class="container pb-5">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }} mt-3">{{ message }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</div>
</body>
</html>
