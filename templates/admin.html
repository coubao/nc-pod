{% extends 'base.html' %}
{% block content %}
<h2>后台管理</h2>
<div class="row g-3">
  <div class="col-lg-5">
    <div class="card p-3">
      <h5>新增记录</h5>
      <form method="post" action="/admin/add" class="row g-2">
        <div class="col-4"><input class="form-control" name="rank" type="number" placeholder="Rank" required></div>
        <div class="col-8"><input class="form-control" name="school" placeholder="School" required></div>
        <div class="col-6"><input class="form-control" name="location" placeholder="Location"></div>
        <div class="col-6"><input class="form-control" name="score" type="number" step="0.1" placeholder="Score"></div>
        <div class="col-12"><input class="form-control" name="tuition" placeholder="Tuition"></div>
        <div class="col-12"><textarea class="form-control" name="notes" placeholder="Notes"></textarea></div>
        <div class="col-12"><button class="btn btn-success w-100">新增</button></div>
      </form>
    </div>
    <div class="card p-3 mt-3">
      <h5>CSV导入</h5>
      <form method="post" action="/admin/upload-csv" enctype="multipart/form-data">
        <input class="form-control mb-2" type="file" name="csv_file" accept=".csv" required>
        <button class="btn btn-primary">覆盖导入</button>
        <a class="btn btn-link" href="/admin/template.csv">下载模板</a>
      </form>
    </div>
  </div>
  <div class="col-lg-7">
    <div class="card p-3">
      <h5>编辑记录</h5>
      {% for r in rankings %}
      <form method="post" action="/admin/update/{{ r.id }}" class="border rounded p-2 mb-2">
        <div class="row g-2">
          <div class="col-2"><input class="form-control" name="rank" value="{{ r.rank }}"></div>
          <div class="col-4"><input class="form-control" name="school" value="{{ r.school }}"></div>
          <div class="col-3"><input class="form-control" name="location" value="{{ r.location }}"></div>
          <div class="col-3"><input class="form-control" name="score" value="{{ r.score }}"></div>
          <div class="col-6"><input class="form-control" name="tuition" value="{{ r.tuition }}"></div>
          <div class="col-6"><input class="form-control" name="notes" value="{{ r.notes }}"></div>
          <div class="col-12 d-flex gap-2">
            <button class="btn btn-sm btn-outline-success">保存</button>
      </form>
            <form method="post" action="/admin/delete/{{ r.id }}" onsubmit="return confirm('确认删除？')">
              <button class="btn btn-sm btn-outline-danger">删除</button>
            </form>
          </div>
        </div>
      {% else %}
      <p class="text-muted">暂无记录</p>
      {% endfor %}
    </div>
  </div>
</div>
{% endblock %}
